<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vata's RP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg1:#0f1115;
      --bg2:#141822;

      --text:#ffffff;
      --muted: rgba(255,255,255,0.86);

      --btn-bg: rgba(255,255,255,0.10);
      --btn-bg-hover: rgba(255,255,255,0.16);
      --btn-border: rgba(255,255,255,0.10);

      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --shadow-soft: 0 8px 22px rgba(0,0,0,0.28);

      --radius: 999px;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
    }

    .container{
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding: 40px;
      transform: translateY(-55px);
    }

    h1{
      font-size: 3em;
      margin: 0 0 12px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    p{
      max-width: 720px;
      font-size: 1.05em;
      line-height: 1.45;
      margin: 0;
      color: var(--muted);
    }

    .quick-start{
      margin-top: 22px;
      padding: 18px 22px;
      border-radius: 16px;
      background: transparent;
      border: none;
      backdrop-filter: blur(8px);
      box-shadow: none;
      max-width: 420px;
      text-align: left;
    }

    .quick-start h3{
      margin: 0 0 10px;
      font-size: 1.05em;
    }

    .quick-start ul{
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .quick-start li{
      margin: 6px 0;
      font-size: 0.95em;
      color: var(--muted);
    }

    .quick-start .hint{
      margin-top: 10px;
      font-size: 0.85em;
      opacity: 0.75;
    }

    .buttons{
      margin-top: 26px;
      display:flex;
      flex-wrap: wrap;
      justify-content:center;
      gap: 12px;
    }

    .btn{
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      font-weight: 700;
      padding: 12px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all .15s ease;
    }

    .btn:hover{
      background: var(--btn-bg-hover);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* 🔥 BOTÓN PRINCIPAL */
    .btn-primary{
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 0 12px rgba(255,255,255,0.15);
    }

    @media (max-width: 720px){
      h1{ font-size: 2.2em; }
      .container{ transform: translateY(-35px); }
      .btn{ width: 100%; max-width: 360px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bienvenido a Vata City RP</h1>

    <p>
      Servidor DarkRP con progresión, economía y múltiples caminos para crecer dentro de la ciudad.
    </p>

    <div class="quick-start">
      <h3>🚀 Empezá así</h3>
      <ul>
        <li>💰 Ganá dinero → Minero o Taxista</li>
        <li>🚗 Movete → Usá vehículos</li>
        <li>🔫 Avanzá → Crimen, mafia o trabajos especiales</li>
      </ul>
      <p class="hint">👉 Presioná F4 para empezar</p>
    </div>

    <div class="buttons">
      <button class="btn btn-primary" onclick="closeMOTD()">🚀 Empezar a jugar</button>
      <button class="btn" onclick="openLink('reglas.html')">📜 Reglas</button>
      <button class="btn" onclick="openExternal('https://discord.gg/mGbqpJTMuX')">💬 Discord</button>
      <button class="btn" onclick="openLink('vip.html')">⭐ Beneficios VIP</button>
      <button class="btn" onclick="openLink('donaciones.html')">💸 Donaciones</button>
    </div>
  </div>

  <script>
    function openExternal(url) {
      if (typeof gmod !== "undefined" && (gmod.openURL || gmod.openUrl)) {
        (gmod.openURL || gmod.openUrl)(url);
      } else {
        window.location.href = url;
      }
    }

    function openLink(path) {
      window.location.href = path;
    }

    function closeMOTD(){
      if (typeof gmod !== "undefined" && gmod.closeHTML) {
        gmod.closeHTML();
      }
    }
  </script>
</body>
</html>
